plugins {
    id 'java'
    id("org.springframework.boot") version("3.5.14")
}

group = 'com.liferay'
version = '1.0-SNAPSHOT'

ext {
    LOMBOK = '1.18.42'
    SPRING_BOOT = '3.5.14'
    OPEN_API = '2.6.0'
    POSGRESQL = '42.7.11'
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly("org.projectlombok:lombok:$LOMBOK")
    annotationProcessor("org.projectlombok:lombok:$LOMBOK")

    implementation("org.springframework.boot:spring-boot-starter-web:$SPRING_BOOT")
    implementation("org.springframework.boot:spring-boot-starter-data-jpa:$SPRING_BOOT")
    implementation("org.springdoc:springdoc-openapi-starter-webmvc-ui:$OPEN_API")
    implementation("org.postgresql:postgresql:$POSGRESQL")

    testImplementation("org.springframework.boot:spring-boot-starter-test:$SPRING_BOOT")
}

test {
    useJUnitPlatform()
}
